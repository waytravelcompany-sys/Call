<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="TRUE CHAT — Discutez en privé avec vos proches.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRUE CHAT">
  <title>TRUE CHAT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
/* =========================================================
   TRUE CHAT — interface « Discussions »
   Toutes les tailles suivent la maquette (748 px de large)
   grâce à --u : 1 unité = 1 px de la maquette.
========================================================= */
:root {
  --u: calc(min(100vw, 520px) / 748);
  --bg: #0a0a0a;
  --card: #1b1b1b;
  --field: #1d1d1d;
  --line: #1d1d1d;
  --green: #57c26f;
  --blue: #4a9df0;
  --gray: #8e8e8e;
  --text: #f2f2f2;
  --bubble-in: #1f1f1f;
  --bubble-me: #12432f;

  --fs-title: calc(var(--u) * 64);
  --fs-name: max(15px, calc(var(--u) * 28));
  --fs-msg: max(13.5px, calc(var(--u) * 25));
  --fs-small: max(12px, calc(var(--u) * 22));
  --fs-chip: max(13.5px, calc(var(--u) * 24));
  --fs-search: max(15px, calc(var(--u) * 30));
  --fs-nav: max(10.5px, calc(var(--u) * 21));

  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: #000;
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { min-height: 100%; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #000;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:active { opacity: .75; }
button:disabled { opacity: .5; cursor: not-allowed; }
[hidden] { display: none !important; }
svg { display: block; }

#app {
  position: relative;
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

/* =========================================================
   AUTHENTIFICATION
========================================================= */
#auth {
  padding: 48px 24px calc(40px + env(safe-area-inset-bottom));
}
#auth .brand { font-weight: 900; font-size: 22px; letter-spacing: 1px; margin-bottom: 28px; }
#auth .brand span { color: var(--green); }
#auth h1 { font-size: clamp(26px, 7vw, 32px); line-height: 1.2; letter-spacing: -.5px; }
#auth p { color: var(--gray); margin: 8px 0 18px; line-height: 1.5; }
label { display: block; margin-top: 14px; font-size: 14px; color: #cfcfcf; }
input, textarea, select {
  display: block; width: 100%;
  padding: 14px 16px; margin: 7px 0;
  border-radius: 14px; border: 1px solid #2a2a2a;
  background: var(--field); color: #fff; font-size: 16px; outline: none;
}
input:focus, textarea:focus { border-color: var(--green); }
input::placeholder, textarea::placeholder { color: #7d7d7d; opacity: 1; }
input[type="file"] { padding: 10px; font-size: 14px; }
textarea { min-height: 100px; resize: vertical; }
#authForm button[type="submit"], .card button {
  width: 100%; margin-top: 12px; padding: 14px 16px;
  border-radius: 14px; background: var(--green); color: #07200f;
  font-weight: 700; font-size: 15px;
}
.link { display: block; width: 100%; margin-top: 12px; padding: 10px; color: var(--green); font-size: 14px; font-weight: 600; }

/* =========================================================
   PAGE PRINCIPALE
========================================================= */
#home {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--u) * 140 + env(safe-area-inset-bottom));
}

/* Boutons du haut */
.topbar {
  position: relative;
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(var(--u) * 18 + env(safe-area-inset-top)) calc(var(--u) * 30) 0 calc(var(--u) * 32);
}
.topbar-right { display: flex; gap: calc(var(--u) * 32); }
.circle {
  width: calc(var(--u) * 56); height: calc(var(--u) * 56); min-width: 34px; min-height: 34px;
  border-radius: 50%; background: #262626; color: #fff;
  display: grid; place-items: center;
}
.circle svg { width: 52%; height: 52%; }
.circle.green { background: var(--green); color: #000; }
.menu-sheet {
  position: absolute; left: calc(var(--u) * 32); top: calc(var(--u) * 84 + env(safe-area-inset-top)); z-index: 50;
  min-width: 210px; padding: 6px;
  background: #1f1f1f; border: 1px solid #2c2c2c; border-radius: 16px;
  box-shadow: 0 14px 40px #000a;
}
.menu-sheet button { display: block; width: 100%; padding: 13px 14px; text-align: left; border-radius: 10px; font-size: 16px; }
.menu-sheet button:active { background: #2a2a2a; }

/* Titre */
.page-title {
  margin: calc(var(--u) * 22) 0 0;
  padding-left: calc(var(--u) * 32);
  height: calc(var(--u) * 88); line-height: calc(var(--u) * 88);
  font-size: var(--fs-title); font-weight: 800; letter-spacing: -.5px;
}

/* Recherche */
.search {
  position: relative;
  display: flex; align-items: center; gap: calc(var(--u) * 13);
  height: calc(var(--u) * 62); min-height: 44px;
  margin: calc(var(--u) * 12) calc(var(--u) * 30) 0 calc(var(--u) * 32);
  padding: 0 calc(var(--u) * 15);
  border-radius: calc(var(--u) * 20);
  background: var(--field);
}
.search-ico { flex: none; width: calc(var(--u) * 36); height: calc(var(--u) * 36); min-width: 20px; min-height: 20px; color: #8a8a8a; }
.search input {
  flex: 1; min-width: 0; margin: 0; padding: 0; border: 0; background: transparent;
  font-size: var(--fs-search); color: #fff; -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: #8a8a8a; }
.search .go {
  flex: none; width: auto; margin: 0; padding: 7px 14px; border-radius: 12px;
  background: var(--green); color: #07200f; font-size: 13px; font-weight: 800;
}
.search input:placeholder-shown ~ .go { display: none; }

#found { display: grid; gap: 8px; margin: 12px calc(var(--u) * 30) 0 calc(var(--u) * 32); }
#found:empty { display: none; }
#found > .panel {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; background: var(--card); border-radius: 16px;
}
#found > .panel p { font-size: var(--fs-msg); overflow-wrap: anywhere; }
#found > .panel button { flex: none; width: auto; margin: 0; padding: 9px 14px; border-radius: 12px; background: var(--green); color: #07200f; font-size: 13px; font-weight: 700; }

/* Filtres */
.chips {
  display: flex; gap: calc(var(--u) * 17);
  margin-top: calc(var(--u) * 48);
  padding: 0 calc(var(--u) * 30) 0 calc(var(--u) * 32);
  overflow-x: auto; scrollbar-width: none; white-space: nowrap;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: calc(var(--u) * 62); min-height: 36px;
  padding: 0 calc(var(--u) * 25);
  border: 2px solid #2c2c2c; border-radius: 999px; background: #1b1b1b;
  font-size: var(--fs-chip); font-weight: 700; color: #9b9b9b;
}
.chip.on { background: #15302a; border-color: #1e4a3a; color: #bfe9d3; }
.chip span { margin-left: .4em; }

/* Archivées */
.archived {
  position: relative; display: flex; align-items: center; width: 100%;
  height: calc(var(--u) * 90); min-height: 52px;
  margin-top: calc(var(--u) * 29);
  padding: 0 calc(var(--u) * 41) 0 calc(var(--u) * 72);
  color: #9a9a9a; text-align: left;
}
.archived svg { width: calc(var(--u) * 34); height: calc(var(--u) * 34); min-width: 20px; min-height: 20px; }
.archived .t { margin-left: calc(var(--u) * 63); font-size: var(--fs-chip); font-weight: 700; }
.archived::after, .chat-row::after {
  content: ""; position: absolute; left: calc(var(--u) * 169); right: 0; bottom: 0;
  height: 2px; background: var(--line);
}

/* Liste des discussions */
.list { display: block; }
.empty { padding: 28px 32px; color: var(--gray); font-size: var(--fs-msg); line-height: 1.5; }
.chat-row {
  position: relative; display: block; width: 100%; text-align: left;
  height: calc(var(--u) * 138); min-height: 66px;
}
.avatar {
  display: grid; place-items: center; flex: none;
  width: calc(var(--u) * 112); height: calc(var(--u) * 112); min-width: 52px; min-height: 52px;
  border-radius: 50%; color: #fff; font-weight: 700;
  font-size: calc(var(--u) * 40); background: #444;
}
.chat-row .avatar {
  position: absolute; left: calc(var(--u) * 32); top: 50%; transform: translateY(-50%);
}
.chat-row .name {
  position: absolute; left: calc(var(--u) * 169); right: calc(var(--u) * 150);
  top: calc(var(--u) * 15); line-height: calc(var(--u) * 42); min-height: 22px;
  font-size: var(--fs-name); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-row .time {
  position: absolute; right: calc(var(--u) * 30); top: calc(var(--u) * 16); line-height: calc(var(--u) * 42);
  font-size: var(--fs-small); color: var(--gray); white-space: nowrap;
}
.chat-row .msg {
  position: absolute; left: calc(var(--u) * 169); right: calc(var(--u) * 30);
  top: calc(var(--u) * 50); height: calc(var(--u) * 42);
  display: flex; align-items: center; gap: calc(var(--u) * 8);
  font-size: var(--fs-msg); color: var(--gray); white-space: nowrap; overflow: hidden;
}
.chat-row .msg .txt { overflow: hidden; text-overflow: ellipsis; }
.chat-row .msg svg { flex: none; }
.chat-row .msg .tick { width: calc(var(--u) * 30); height: 14px; }
.chat-row .msg .mic { width: calc(var(--u) * 20); height: calc(var(--u) * 30); min-width: 11px; min-height: 16px; }

/* =========================================================
   AUTRES ONGLETS
========================================================= */
.tab { padding: calc(var(--u) * 24) calc(var(--u) * 30) 0 calc(var(--u) * 32); }
.card, .tab .panel {
  margin-bottom: 12px; padding: 16px; background: var(--card); border-radius: 18px;
}
.tab .panel small { display: block; margin-top: 8px; color: var(--gray); font-size: 12px; }
.tab .panel p { overflow-wrap: anywhere; }
.tab p { color: #cfcfcf; line-height: 1.5; font-size: 15px; }
.tab .hint { color: var(--gray); font-size: 13px; margin-top: 12px; }
.tab button.item {
  display: block; width: 100%; padding: 16px; margin-bottom: 8px; text-align: left;
  background: var(--card); border-radius: 16px; font-size: 16px; overflow-wrap: anywhere;
}
.tab img, .tab video { display: block; max-width: 100%; height: auto; border-radius: 14px; margin-top: 8px; }
.settings-list { margin-top: 8px; }
.settings-list button {
  display: block; width: 100%; padding: 16px 4px; text-align: left; font-size: 16px;
  border-bottom: 1px solid var(--line);
}
#settingsContent { margin-top: 14px; overflow-wrap: anywhere; }
#settingsContent p { font-size: 13px; color: var(--gray); margin-bottom: 6px; }
#myProfile p:first-child { font-size: 20px; font-weight: 700; color: #fff; }
#myProfile p { color: var(--gray); margin-bottom: 2px; }

/* =========================================================
   BARRE DU BAS
========================================================= */
nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; width: 100%; max-width: 520px;
  height: calc(var(--u) * 122 + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: linear-gradient(#111, #17150f);
  border-top: 2px solid #1b1b1b;
}
nav button {
  position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: calc(var(--u) * 8); padding-top: calc(var(--u) * 14);
  color: #8d8d8d; font-size: var(--fs-nav); font-weight: 600;
}
nav button svg { width: calc(var(--u) * 58); height: calc(var(--u) * 56); min-width: 28px; min-height: 26px; }
nav button.active { color: #fff; font-weight: 800; }
.me {
  display: grid; place-items: center;
  width: calc(var(--u) * 52); height: calc(var(--u) * 52); min-width: 28px; min-height: 28px; margin: calc(var(--u) * 2) 0;
  border-radius: 50%; border: 2px solid #333; background: #000; color: var(--green);
  font-size: calc(var(--u) * 20); font-weight: 800;
}

/* =========================================================
   CONVERSATION OUVERTE
========================================================= */
#room:not([hidden]) { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: #0b0b0b; }
.room-bar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 10px 10px 6px;
  background: #121212; border-bottom: 1px solid #1d1d1d;
}
.room-bar > button { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.room-bar > button svg { width: 24px; height: 24px; }
.avatar.sm { width: 40px; height: 40px; min-width: 40px; min-height: 40px; font-size: 16px; }
.room-title { flex: 1; min-width: 0; }
#roomTitle { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#roomInfo { font-size: 12px; color: var(--gray); }
#roomInfo:empty { display: none; }

#messages {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 6px; padding: 14px 12px;
}
.bubble {
  max-width: 82%; align-self: flex-start; padding: 8px 12px 6px;
  background: var(--bubble-in); border-radius: 16px 16px 16px 4px;
  overflow-wrap: anywhere; word-break: break-word; font-size: 16px; line-height: 1.35;
}
.bubble.mine { align-self: flex-end; background: var(--bubble-me); border-radius: 16px 16px 4px 16px; }
.bubble small { display: block; text-align: right; opacity: .6; margin-top: 3px; font-size: 11px; }
.bubble img, .bubble video { display: block; max-width: 100%; height: auto; border-radius: 10px; margin: 2px 0 4px; }
.bubble a { color: #8fe3a5; overflow-wrap: anywhere; }

#typingIndicator { padding: 4px 16px; color: var(--green); font-size: 13px; }
#selectedFile { padding: 0 14px; font-size: 13px; color: #a6dcb4; overflow-wrap: anywhere; }
#selectedFile:empty { display: none; }
#mediaPreview img, #mediaPreview video { max-width: 100%; height: auto; border-radius: 12px; }

.composer {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: #121212; border-top: 1px solid #1d1d1d;
}
.composer input[type="text"] { flex: 1; min-width: 0; margin: 0; border-radius: 999px; padding: 12px 18px; }
.filebtn, .composer button {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer;
}
.filebtn { background: #262626; color: #fff; }
.filebtn svg, .composer button svg { width: 22px; height: 22px; }
.composer button { margin: 0; padding: 0; background: var(--green); color: #07200f; }

/* =========================================================
   MODALE D'APPEL WEBRTC (AUDIO / VIDEO)
========================================================= */
#callModal {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
  background: #0a0a0a; color: #fff;
}
.call-video-wrapper {
  position: relative; flex: 1; width: 100%; margin: 16px 0;
  background: #121212; border-radius: 20px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
#localVideo {
  position: absolute; right: 16px; top: 16px; width: 110px; height: 150px;
  object-fit: cover; border-radius: 14px; border: 2px solid #2a2a2a; background: #000;
  z-index: 10;
}
.call-controls { display: flex; gap: 16px; justify-content: center; align-items: center; }
.call-btn {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  font-size: 20px; font-weight: 700;
}
.call-btn.end { background: #e63946; color: #fff; }
.call-btn.accept { background: var(--green); color: #000; }

/* =========================================================
   NOTIFICATION FLOTTANTE
========================================================= */
#notice {
  position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 100;
  display: none; width: max-content; max-width: 90%; padding: 12px 16px;
  background: #1f1f1f; color: #fff; border: 1px solid #333; border-radius: 12px;
  overflow-wrap: anywhere; box-shadow: 0 8px 25px #0006; font-size: 14px; color: #fff;
}
a { color: var(--green); }

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ===================== AUTHENTIFICATION ===================== -->
  <section id="auth">
    <div class="brand">✦ TRUE <span>CHAT</span></div>
    <h1>Bienvenue sur TRUE CHAT</h1>
    <p>Discutez avec vos proches, simplement et en privé.</p>
    <form id="authForm">
      <label for="name">Nom complet</label>
      <input id="name" name="name" type="text" placeholder="Votre nom complet" autocomplete="name">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" name="username" type="text" placeholder="Choisissez un nom d'utilisateur"
             autocomplete="username" minlength="3" maxlength="30">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" placeholder="Votre adresse e-mail" autocomplete="email" required>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" placeholder="6 caractères minimum"
             minlength="6" autocomplete="current-password" required>
      <button type="submit" id="authSubmit">Se connecter</button>
    </form>
    <button class="link" id="toggleAuth" type="button">Créer un compte</button>
    <button class="link" id="forgotPassword" type="button">Mot de passe oublié ?</button>
  </section>

  <!-- ===================== APPLICATION PRINCIPALE ===================== -->
  <section id="home" hidden>

    <!-- Boutons du haut : menu, caméra, nouvelle discussion -->
    <div class="topbar">
      <button id="menuBtn" class="circle" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg>
      </button>
      <div class="topbar-right">
        <button id="cameraBtn" class="circle" type="button" aria-label="Ajouter un statut">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4 7.6 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.6L15 4H9Zm3 4.2A4.3 4.3 0 1 1 7.7 12.5 4.3 4.3 0 0 1 12 8.2Zm0 2a2.3 2.3 0 1 0 2.3 2.3A2.3 2.3 0 0 0 12 10.2Z"/></svg>
        </button>
        <button id="newConversation" class="circle green" type="button" aria-label="Nouvelle conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
        </button>
      </div>
      <div id="menuSheet" class="menu-sheet" hidden>
        <button id="newGroup" type="button">Nouveau groupe</button>
        <button id="refresh" type="button">Actualiser</button>
        <button id="logout" type="button" hidden>Déconnexion</button>
      </div>
    </div>

    <h1 id="pageTitle" class="page-title">Discussions</h1>

    <!-- ----- DISCUSSIONS ----- -->
    <section id="chatSection">
      <form id="searchForm" class="search" autocomplete="off">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
        <input id="findEmail" name="findEmail" type="search" placeholder="Rechercher un nom ou @utilisateur"
               autocomplete="off" minlength="3">
        <button id="findUser" class="go" type="submit" aria-label="Rechercher">OK</button>
      </form>
      <div id="found"></div>

      <div class="chips">
        <button type="button" class="chip on" data-filter="all">Toutes</button>
        <button type="button" class="chip" data-filter="unread">Non lues</button>
        <button type="button" class="chip" data-filter="favorites">Favoris</button>
        <button type="button" class="chip" data-filter="groups">Groupes<span id="groupsCount"></span></button>
      </div>

      <button type="button" id="archivedRow" class="archived">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="5.5" rx="1.2"/><path d="M4.5 9v10.5h15V9M9.5 13h5"/></svg>
        <span class="t">Archivées</span>
      </button>

      <div id="chats" class="list"></div>
    </section>

    <!-- ----- ACTUS (STATUTS) ----- -->
    <section id="statusSection" class="tab" hidden>
      <form id="statusForm" class="card">
        <label for="statusText">Partager un statut</label>
        <textarea id="statusText" name="statusText" placeholder="Quoi de neuf ?"></textarea>
        <label for="statusMedia">Ajouter une photo ou une vidéo</label>
        <input id="statusMedia" name="statusMedia" type="file" accept="image/*,video/*">
        <button type="submit">Publier le statut</button>
      </form>
      <div id="statuses"></div>
    </section>

async function loadProfile() {
  if (!me) return;
  const { data, error } = await db
    .from('profiles')
    .select('id, username, full_name, avatar_url, bio, last_seen')
    .eq('id', me.id)
    .maybeSingle();
  if (error) throw error;
  profile = data;
  /*
   * Le trigger SQL crée d'abord un username automatique.
   * On tente de remplacer ce nom par celui choisi à l'inscription.
   */
  const wantedUsername = me.user_metadata?.username;
  if (
    profile &&
    wantedUsername &&
    profile.username?.startsWith('user_') &&
    validUsername(wantedUsername)
  ) {
    const { data: updated, error: updateError } = await db
      .from('profiles')
      .update({
        username: wantedUsername,
        full_name: me.user_metadata?.full_name || profile.full_name || ''
      })
      .eq('id', me.id)
      .select('id, username, full_name, avatar_url, bio, last_seen')
      .maybeSingle();
    if (!updateError && updated) {
      profile = updated;
    } else if (updateError) {
      console.warn('Profil non modifié:', updateError.message);
    }
  }
  renderProfile();
}

const ICON_TICK =
  '<svg class="tick" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 4 4L17 3"/></svg>';
const ICON_MIC =
  '<svg class="mic" viewBox="3 1 18 22" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9Z"/></svg>';
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0] || '?') + (parts[1]?.[0] || '')).toUpperCase();
}
function avatarColor(seed) {
  let hue = 0;
  for (const char of String(seed)) {
    hue = (hue * 47 + char.charCodeAt(0) * 13) % 360;
  }
  return 'hsl(' + hue + ' 32% 32%)';
}
function formatChatTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  const day = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(date)) / 86400000);
  if (diff <= 0) {
    return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  if (diff === 1) return 'Hier';
  if (diff < 7) return date.toLocaleDateString('fr-FR', { weekday: 'long' });
  return date.toLocaleDateString('fr-FR');
}
function previewOf(last) {
  if (!last) return { text: '', voice: false };
  if (last.deleted_at) return { text: 'Message supprimé', voice: false };
  if (last.type === 'voice') return { text: 'Message vocal', voice: true };
  if (last.type === 'image') return { text: 'Photo', voice: false };
  if (last.type === 'video') return { text: 'Vidéo', voice: false };
  if (last.type === 'file') return { text: 'Fichier', voice: false };
  return { text: last.content || '', voice: false };
}
function renderChatList() {
  const box = $('chats');
  if (!box) return;
  box.replaceChildren();
  const groupCount = chatRows.filter(row => row.isGroup).length;
  if ($('groupsCount')) {
    $('groupsCount').textContent = groupCount ? String(groupCount) : '';
  }
  const rows = chatRows.filter(row => {
    if (chatFilter === 'groups' && !row.isGroup) return false;
    if (chatQuery && !row.name.toLowerCase().includes(chatQuery)) return false;
    return true;
  });
  if (!rows.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = chatRows.length
      ? 'Aucune discussion ne correspond.'
      : 'Aucune conversation. Recherchez une personne pour commencer.';
    box.append(empty);
    return;
  }
  rows.forEach(row => {
    const item = document.createElement('button');
    item.type = 'button';

    avatar.className = 'avatar';
    avatar.style.background = avatarColor(row.name);
    avatar.textContent = initials(row.name);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = row.name;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = formatChatTime(row.time);
    const msg = document.createElement('span');
    msg.className = 'msg';
    const preview = previewOf(row.last);
    if (row.last && row.last.sender_id === me?.id && !row.last.deleted_at) {
      msg.insertAdjacentHTML('beforeend', ICON_TICK);
    }
    if (preview.voice) {
      msg.insertAdjacentHTML('beforeend', ICON_MIC);
    }
    const text = document.createElement('span');
    text.className = 'txt';
    text.textContent = preview.text;
    msg.append(text);
    item.append(avatar, name, time, msg);
    item.onclick = () => openRoom(row.id);
    box.append(item);
  });
}

          .from('conversation_members')
          .select('user_id')
          .eq('conversation_id', id)
          .neq('user_id', me.id)
          .limit(1);
        const otherId = others?.[0]?.user_id;
        if (otherId) {
          const { data: other } = await db
            .from('profiles')
            .select('full_name, username')
            .eq('id', otherId)
            .maybeSingle();
          if (other) name = other.full_name || other.username || name;
        }
      } catch (lookupError) {
        console.warn(lookupError);
      }
    }
    let last = null;
    try {
      const { data: latest } = await db
        .from('messages')
        .select('content, type, sender_id, created_at, deleted_at')
        .eq('conversation_id', id)
        .order('created_at', { ascending: false })
        .limit(1);
      last = latest?.[0] || null;
    } catch (lastError) {
      console.warn(lastError);
    }
    return {
      id,
      name,
      isGroup: Boolean(conversation.is_group),
      last,
      time: last?.created_at || conversation.last_message_at || conversation.created_at
    };
  }));
  chatRows = rows
    .filter(Boolean)
    .sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
  renderChatList();
}

/* =====================================================

async function openRoom(id) {
  room = id;
  $show('home', false);
  $show('room', true);
  const { data, error } = await db
    .from('conversations')
    .select('id, title, is_group')
    .eq('id', id)
    .maybeSingle();
  if (error) {
    errorMessage(error);
    return;
  }
  const cached = chatRows.find(row => row.id === id);
  const roomName = cached?.name ||
    data?.title || (data?.is_group ? 'Groupe' : 'Conversation privée');
  $('roomTitle').textContent = roomName;
  if ($('roomAvatar')) {
    $('roomAvatar').textContent = initials(roomName);
    $('roomAvatar').style.background = avatarColor(roomName);
  }
  try {
    await loadMessages();
    subscribeToMessages();
  } catch (messageError) {
    errorMessage(messageError);
  }
}
$('back')?.addEventListener('click', async () => {

/* =====================================================
   MESSAGES
===================================================== */
async function loadMessages() {
  if (!room || !me) return;
  const box = $('messages');
  box.replaceChildren();
  const { data, error } = await db
    .from('messages')
    .select(
      'id, conversation_id, sender_id, content, type, media_path, media_name, created_at, deleted_at'
    )
    .eq('conversation_id', room)
    .order('created_at', { ascending: true })
    .limit(150);
  if (error) throw error;
  for (const message of data || []) {
    await renderMessage(message, box);
  }
  box.scrollTop = box.scrollHeight;
}
async function renderMessage(message, box) {
  const bubble = document.createElement('div');
  bubble.className =
    'bubble' + (message.sender_id === me.id ? ' mine' : '');
  if (message.deleted_at) {
    bubble.textContent = 'Ce message a été supprimé.';
  } else {
    if (message.content) {
      const text = document.createElement('div');
      text.textContent = message.content;
      bubble.append(text);
    }
    if (message.media_path) {
      const bucket =
        message.type === 'image' ||
        message.type === 'video' ||
        message.type === 'voice' ||
        message.type === 'file'
          ? 'media'
          : null;
      if (bucket) {
        const { data, error } = await db.storage
          .from(bucket)
          .createSignedUrl(message.media_path, 3600);
        if (!error && data?.signedUrl) {
          if (message.type === 'image') {
            const img = document.createElement('img');
            img.src = data.signedUrl;
            img.alt = message.media_name || 'Image';
            img.loading = 'lazy';
            bubble.append(img);
          } else if (message.type === 'video') {
            const video = document.createElement('video');
            video.src = data.signedUrl;
            video.controls = true;
            video.playsInline = true;
            bubble.append(video);
          } else {
            const link = document.createElement('a');
            link.href = data.signedUrl;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent =
              message.media_name || 'Ouvrir le fichier';
            bubble.append(link);
          }
        }
      }
    }
  }
  const time = document.createElement('small');
  time.textContent = message.created_at
    ? new Date(message.created_at).toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      })
    : '';
  bubble.append(time);
  box.append(bubble);
}
function subscribeToMessages() {
  if (!room || !db) return;
  if (roomChannel) {
    db.removeChannel(roomChannel);
    roomChannel = null;
  }
  const subscribedRoom = room;
  roomChannel = db
    .channel('messages-' + subscribedRoom)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: 'conversation_id=eq.' + subscribedRoom
      },
      async payload => {
        if (room !== subscribedRoom) return;
        const box = $('messages');
        if (box && payload.new) {
          await renderMessage(payload.new, box);
          box.scrollTop = box.scrollHeight;
        }
      }
    )
    .subscribe();
}
/* =====================================================
   ENVOI DE MESSAGES ET DE MÉDIAS
===================================================== */
$('attachment')?.addEventListener('change', () => {
  selectedMedia = $('attachment').files?.[0] || null;
  const label = $('selectedFile');
  if (label) {
    label.textContent = selectedMedia
      ? selectedMedia.name + ' — prêt à être envoyé avec votre message'
      : '';

});
$('sendForm')?.addEventListener('submit', async event => {
  event.preventDefault();
  if (!room || !me) {
    notify('Ouvrez une conversation avant d’envoyer un message.');
    return;
  }
  const text = $('messageText').value.trim();
  const file = selectedMedia;
  const button = $('sendForm').querySelector('button[type="submit"]');
  if (!text && !file) {
    notify('Écrivez un message ou choisissez un fichier.');
    return;
  }
  if (file && file.size > 25 * 1024 * 1024) {
    notify('Le fichier dépasse la limite de 25 Mo.');
    return;
  }
  setBusy(button, true, 'Envoi...');
  try {
    let mediaPath = null;
    let mediaName = null;
    let mediaSize = null;
    let type = 'text';
    if (file) {
      const extension = file.name.includes('.')
        ? file.name.split('.').pop().toLowerCase()
        : 'bin';
      const safeName =
        crypto.randomUUID() + '.' + extension;
      mediaPath = room + '/' + safeName;
      mediaName = file.name;
      mediaSize = file.size;
      if (file.type.startsWith('image/')) {
        type = 'image';
      } else if (file.type.startsWith('video/')) {
        type = 'video';
      } else if (file.type.startsWith('audio/')) {
        type = 'voice';
      } else {
        type = 'file';
      }
      const { error: uploadError } = await db.storage
        .from('media')
        .upload(mediaPath, file, {
          contentType: file.type || 'application/octet-stream',
          upsert: false
        });
      if (uploadError) throw uploadError;
    }
    const payload = {
      conversation_id: room,
      sender_id: me.id,
      content: text || null,
      type,
      media_path: mediaPath,
      media_name: mediaName,
      media_size: mediaSize
    };
    const { error } = await db
      .from('messages')
      .insert(payload);
    if (error) {
      /*
       * Si la base refuse le message après le téléversement,
       * on tente de supprimer le fichier qui vient d'être envoyé.
       */
      if (mediaPath) {
        await db.storage.from('media').remove([mediaPath]);
      }
      throw error;
    }
    $('messageText').value = '';
    $('attachment').value = '';
    $('selectedFile').textContent = '';
    selectedMedia = null;
    await loadMessages();
  } catch (error) {
    errorMessage(error);
  } finally {
    setBusy(button, false);
  }
});
/* =====================================================
   STATUTS : TEXTE, IMAGE OU VIDÉO
===================================================== */
$('statusForm')?.addEventListener('submit', async event => {
  event.preventDefault();
  if (!me) return;
  const content = $('statusText').value.trim();
  const file = $('statusMedia').files?.[0] || null;
  if (!content && !file) {
    notify('Écrivez un statut ou choisissez une photo/vidéo.');
    return;
  }
  if (file && file.size > 25 * 1024 * 1024) {
    notify('Le fichier dépasse la limite de 25 Mo.');
    return;
  }
  try {
    let type = 'text';
    let mediaPath = null;
    if (file) {
      type = file.type.startsWith('image/') ? 'image' : 'video';
      if (!file.type.startsWith('image/') &&
          !file.type.startsWith('video/')) {
        throw new Error('Les statuts acceptent les images et les vidéos.');
      }
      const extension = file.name.includes('.')
        ? file.name.split('.').pop().toLowerCase()
        : 'bin';
      mediaPath = me.id + '/' + crypto.randomUUID() + '.' + extension;
      const { error: uploadError } = await db.storage
        .from('statuses')
        .upload(mediaPath, file, {
          contentType: file.type,
          upsert: false
        });
      if (uploadError) throw uploadError;
    }
    const { error } = await db
      .from('statuses')
      .insert({
        user_id: me.id,
        type,
        content: content || null,
        media_path: mediaPath,
        expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
      });
    if (error) {
      if (mediaPath) {
        await db.storage.from('statuses').remove([mediaPath]);
      }
      throw error;
    }
    $('statusText').value = '';
    $('statusMedia').value = '';
    await loadStatuses();
    notify('Statut publié. Il expire après 24 heures.');
  } catch (error) {
    errorMessage(error);
  }
});
async function loadStatuses() {
  if (!me) return;
  const box = $('statuses');
  if (!box) return;
  const { data, error } = await db
    .from('statuses')
    .select('id, user_id, type, content, media_path, created_at, expires_at')
    .gt('expires_at', new Date().toISOString())
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) throw error;
  box.replaceChildren();
  if (!data?.length) {
    box.textContent = 'Aucun statut récent.';
    return;
  }
  for (const status of data) {
    const card = document.createElement('div');
    card.className = 'panel';
    const text = document.createElement('p');
    text.textContent = status.content || 'Statut média';
    card.append(text);
    if (status.media_path) {
      const bucket = 'statuses';
      const { data: signed, error: signedError } = await db.storage
        .from(bucket)
        .createSignedUrl(status.media_path, 3600);
      if (!signedError && signed?.signedUrl) {
        if (status.type === 'image') {
          const img = document.createElement('img');
          img.src = signed.signedUrl;
          img.alt = 'Statut';
          img.style.maxWidth = '100%';
          card.append(img);
        } else if (status.type === 'video') {
          const video = document.createElement('video');
          video.src = signed.signedUrl;
          video.controls = true;
          video.playsInline = true;
          video.style.maxWidth = '100%';
          card.append(video);
        }
      }
    }
    const date = document.createElement('small');
    date.textContent = new Date(status.created_at).toLocaleString('fr-FR');
    card.append(date);
    box.append(card);
  }
}
/* =====================================================
   NOTIFICATIONS
===================================================== */
async function loadNotifications() {
  if (!me || !db) return;
  const box = $('notificationsList');
  if (!box) return;
  const { data, error } = await db

    .order('created_at', { ascending: false })

  if (error) throw error;
  box.replaceChildren();
  if (!data?.length) {
    box.textContent = 'Aucune notification.';
    return;
  }
  data.forEach(notification => {

    item.textContent =

   NAVIGATION
===================================================== */
const tabTargets = {
  chats: 'chatSection',
  status: 'statusSection',
  calls: 'callsSection',
  contacts: 'contactsSection',
  settings: 'settingsSection',
  notifications: 'notificationsSection'
};
const tabTitles = {
  chats: 'Discussions',
  status: 'Actus',
  calls: 'Appels',
  contacts: 'Contacts',
  settings: 'Vous',
  notifications: 'Notifications'
};
function showTab(tab) {
  currentTab = tab;
  if ($('pageTitle')) {
    $('pageTitle').textContent = tabTitles[tab] || 'TRUE CHAT';
  }
  Object.values(tabTargets).forEach(id => {
    $show(id, false);
  });
  if (tabTargets[tab]) {
    $show(tabTargets[tab], true);
  }
  document.querySelectorAll('[data-tab]').forEach(button => {
    button.classList.toggle('active', button.dataset.tab === tab);
  });
  if (tab === 'status') {
    loadStatuses().catch(errorMessage);
  }
  if (tab === 'contacts') {
    loadContacts().catch(errorMessage);
  }
  if (tab === 'calls') {
    loadCalls().catch(errorMessage);
  }
  if (tab === 'settings') {
    showSettings();
  }
  if (tab === 'notifications') {
    loadNotifications().catch(errorMessage);
  }
}
document.querySelectorAll('[data-tab]').forEach(button => {
  button.addEventListener('click', () => {
    showTab(button.dataset.tab);
  });
});

   CONTACTS
===================================================== */
async function loadContacts() {
  if (!me) return;
  const box = $('contactsList');
  if (!box) return;
  const { data, error } = await db
    .from('contacts')
    .select('contact_id, nickname')
    .eq('owner_id', me.id);

  box.replaceChildren();
  if (!data?.length) {
    box.textContent = 'Aucun contact enregistré.';
    return;
  }
  for (const contact of data) {
    const { data: user, error: userError } = await db
      .from('profiles')
      .select('id, username, full_name')
      .eq('id', contact.contact_id)

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'item';
    button.textContent =
      contact.nickname || user.full_name || user.username;
    button.onclick = () => startPrivateChat(user.id);
    box.append(button);

}

   APPELS : HISTORIQUE UNIQUEMENT POUR LE MOMENT

async function loadCalls() {

/* =====================================================
   DÉMARRAGE
===================================================== */
if (!ready) {
  notify('Vérifiez config.js : URL et clé Publishable Supabase.');
} else {
  const { data } = db.auth.onAuthStateChange((_event, session) => {
    me = session?.user || null;
    setTimeout(() => {
      if (me) {
        initialize().catch(errorMessage);
      } else {
        profile = null;
        renderAuth();
      }
    }, 0);
  });
  authListener = data?.subscription;
  db.auth.getSession()
    .then(({ data: sessionData, error }) => {
      if (error) throw error;
      me = sessionData?.session?.user || null;
      if (me) {
        return initialize();
      }
      renderAuth();
    })
    .catch(errorMessage);
}
